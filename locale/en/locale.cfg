[mod-setting-name]
enable-mod=Enable RecentHotbar
do-items-in-hotbar=Add non-placeable items to hotbar
do-ghosts-in-hotbar=Add cursor ghosts to hotbar
working-hotbar=Working Hotbar
sort-rl=Sort Right-Left
[mod-setting-description]
enable-mod=If false, the hotbar will not be scrolled with recent items, completely disabling the functionality of this mod.
do-items-in-hotbar=If items that aren't placeable should be inserted into the hotbar when grabbed
do-ghosts-in-hotbar=If cursor ghosts should also be added to the hotbar, only works in conjunction with the interface setting "Pick ghost item if no items are available" 
working-hotbar=The hotbar number that this will operate on
sort-rl=Reverse the sort direction from "left to right" to "right to left"
